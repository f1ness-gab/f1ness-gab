<head>
<style>
body {
    background-image: url("/imgs/bron.jpg");
    background-repeat: no-repeat;

    margin-right: 300px;
}
h1 {
	color: rgb(133, 53, 252);
}
p {
	color: rgb(133, 53, 252);
}

<body>
<h1>Hello Bron!</h1>
