<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Activities 1-10</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    .activity {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 30px;
    }
    .code {
      background-color: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    .output {
      background: #e8f0fe;
      border-left: 4px solid #4285f4;
      padding: 10px 15px;
      border-radius: 4px;
    }
    button {
      margin-top: 10px;
    }
  </style>
</head>
  <!-- Activity 10 -->
  <div class="activity">
    <h2>Activity 10: Simple Calculator</h2>
    <div class="code">
let n1 = parseFloat(...);\nlet n2 = parseFloat(...);\ndocument.getElementById("result").innerHTML = "Result: " + (n1 + n2);
    </div>
    <div class="output">
      <input type="number" id="num1">
      <input type="number" id="num2">
      <button onclick="let a = parseFloat(document.getElementById('num1').value); let b = parseFloat(document.getElementById('num2').value); document.getElementById('result10').innerText = 'Result: ' + (a + b);">Add</button>
      <p id="result10"></p>
    </div>
  </div>
</body>
</html>
