<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Activity 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    .activity {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 30px;
    }
    .code {
      background-color: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    .output {
      background: #e8f0fe;
      border-left: 4px solid #4285f4;
      padding: 10px 15px;
      border-radius: 4px;
    }
    button {
      margin-top: 10px;
    }
  </style>
</head>

<!-- Activity 2 -->
<div class="activity">
    <h2>Activity 2: Change Text Content</h2>
    <div class="code">
&lt;p id="demo"&gt;Original text&lt;/p&gt;\n&lt;script&gt;\ndocument.getElementById("demo").innerHTML = "Text changed by JavaScript!";\n&lt;/script&gt;
    </div>
    <div class="output">
      <p id="demo2">Original text</p>
      <button onclick="document.getElementById('demo2').innerText = 'Text changed by JavaScript!'">Change Text</button>
    </div>
  </div>
</body>
</html>
